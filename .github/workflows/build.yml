name: Build NX809J

# The trusted self-hosted runner provisions release keys locally. The workflow
# never downloads private keys or includes them in artifacts.
on:
  workflow_dispatch:
    inputs:
      reposync:
        description: Sync the pinned source manifest before building
        type: boolean
        default: false

concurrency:
  group: nx809j-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, nx809j]
    timeout-minutes: 900
    permissions:
      contents: write
    env:
      AVIUM_TREE: ${{ vars.LINEAGE_TREE || '/root/avium' }}
      PORT_SCRIPT: ${{ vars.NX809J_PORT_SCRIPT || '/root/port_nx809j_avium.sh' }}
      RELEASE_DIR: ${{ vars.NX809J_RELEASE_DIR || '/root/nx809-fw-0823' }}
      OUTDIR: ${{ vars.NX809J_OUTDIR || '/root/nx809j-avium-out' }}
      SCRATCH: ${{ vars.NX809J_SCRATCH || '/root/nx809-super-scratch' }}
      LUNCH: lineage_NX809J-bp4a-user
      JOBS: 6
      SKIP_MINSDK: 1
      LC_ALL: C

    steps:
      - name: Check environment
        run: |
          test -f "$PORT_SCRIPT"
          df -h "$AVIUM_TREE"
          free -h
          swapon --show

      - name: Sync pinned sources
        if: ${{ inputs.reposync }}
        run: bash "$PORT_SCRIPT" sync

      - name: Verify separately provisioned release keys
        run: |
          python3 "$AVIUM_TREE/device/nubia/NX809J/scripts/release_keys.py" \
            verify --source-tree "$AVIUM_TREE"

      - name: Build and verify user partitions
        run: bash "$PORT_SCRIPT" build

      - name: Verify image signatures and assemble Super
        run: |
          if [ "$(id -u)" = 0 ]; then
            bash "$PORT_SCRIPT" super
          else
            sudo -n env AVIUM_TREE="$AVIUM_TREE" RELEASE_DIR="$RELEASE_DIR" \
              OUTDIR="$OUTDIR" SCRATCH="$SCRATCH" LUNCH="$LUNCH" JOBS="$JOBS" \
              bash "$PORT_SCRIPT" super
          fi

      - name: Package verified artifacts
        id: package
        run: |
          destination=$(mktemp -d "$RUNNER_TEMP/nx809j-release.XXXXXX")
          for partition in boot init_boot vendor_boot dtbo vbmeta vbmeta_system recovery; do
            cp "$OUTDIR/$partition.img" "$destination/"
          done
          cp "$OUTDIR/MD5SUMS.txt" "$destination/"
          cp "$OUTDIR/SHA256SUMS.txt" "$destination/"
          cp "$OUTDIR/release-signing-report.json" "$destination/"
          cp "$AVIUM_TREE/device/nubia/NX809J-kernel/prebuilt/kernel-provenance.json" "$destination/"
          zstd -15 -T0 -o "$destination/super.img.zst" "$OUTDIR/super.img"
          split -b 1900M -d -a 2 "$destination/super.img.zst" "$destination/super.img.zst.part"
          rm -- "$destination/super.img.zst"
          (cd "$destination" && sha256sum *.part* > SHA256SUMS.parts.txt)
          echo "directory=$destination" >> "$GITHUB_OUTPUT"
          echo "tag=nx809j-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.directory }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          notes_file="$RUNNER_TEMP/nx809j-release-notes.txt"
          cat > "$notes_file" <<'EOF'
          NX809J AviumUI user build with private APK/APEX/AVB release signatures.
          Kernel: pinned personal 6.12.38/ReSukiSU. Fixed vendor/ODM/DLKM inputs are retained.
          Hybrid vbmeta flags remain 3; this does not establish an OEM locked-boot trust chain.

          Reassemble Super: cat super.img.zst.part* | zstd -d -o super.img
          Verify parts with SHA256SUMS.parts.txt, then images with SHA256SUMS.txt.
          A clean user-data installation and the verified SuperFastboot mode are required.
          See signing/README.md for scope and preserved pre-signed components.
          EOF
          gh release create "$RELEASE_TAG" "$ARTIFACT_DIRECTORY"/* \
            --repo "$GITHUB_REPOSITORY" --title "NX809J $RELEASE_TAG" --notes-file "$notes_file"
